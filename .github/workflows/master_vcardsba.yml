# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - vcardsba

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        working-directory: nfc-travel-vcard
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install
          npm run build

      - name: Zip artifact for deployment
        run: zip -r release.zip ./nfc-travel-vcard/dist

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate version tags
        id: meta
        run: |
          # Generate version based on date and commit
          DATE_TAG=$(date +'%Y%m%d')
          SHORT_SHA=${GITHUB_SHA:0:7}
          VERSION_TAG="v${DATE_TAG}-${SHORT_SHA}"
          
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nfc-travel-vcard
          file: ./nfc-travel-vcard/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nfc-docker-app:latest
            ${{ secrets.DOCKER_USERNAME }}/nfc-docker-app:${{ steps.meta.outputs.version_tag }}
            ${{ secrets.DOCKER_USERNAME }}/nfc-docker-app:${{ steps.meta.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip -d .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2CBAE7E9FB684BC4B09D77A9A5AA4A42 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_27B8D487494446CEB7A4E14E59B8614F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E244A808E6D34058B96F5DA85499223E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vcardsba'
          slot-name: 'Production'
          package: ./nfc-travel-vcard/build
          enable-oryx-build: false
          environment-variables: |
            WEBSITES_INCLUDE_CLOUD_CERTS=true
