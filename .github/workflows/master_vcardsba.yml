# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - vcardsba

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  docker:
    description: Create the container image and push it to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate version tags
        id: meta
        run: |
          # Generate version based on date and commit
          DATE_TAG=$(date +'%Y%m%d')
          SHORT_SHA=${GITHUB_SHA:0:7}
          VERSION_TAG="v${DATE_TAG}-${SHORT_SHA}"
          
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nfc-travel-vcard
          file: ./nfc-travel-vcard/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nfc-docker-app:latest
            ${{ secrets.DOCKER_USERNAME }}/nfc-docker-app:${{ steps.meta.outputs.version_tag }}
            ${{ secrets.DOCKER_USERNAME }}/nfc-docker-app:${{ steps.meta.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

