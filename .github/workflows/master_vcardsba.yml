name: Build and deploy nfc-travel-vcard to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: /home/runner/work/bagid/bagid/nfc-travel-vcard/package-lock.json

      - name: Install dependencies
        working-directory: nfc-travel-vcard
        run: npm ci

      - name: Lint
        working-directory: nfc-travel-vcard
        run: npm run lint

      - name: Type check
        working-directory: nfc-travel-vcard
        run: npm run type-check

      - name: Build Cloudflare worker bundle
        working-directory: nfc-travel-vcard
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./nfc-travel-vcard
          command: deploy
