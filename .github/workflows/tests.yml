name: Tests (nfc-travel-vcard)

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nfc-travel-vcard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nfc-travel-vcard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm test
