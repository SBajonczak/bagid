log_format bagtag_verbose 'ts=$time_iso8601 remote=$remote_addr xff="$http_x_forwarded_for" '
                          'method=$request_method host="$host" uri="$request_uri" status=$status '
                          'bytes=$body_bytes_sent req_time=$request_time '
                          'upstream="$upstream_addr" upstream_status="$upstream_status" '
                          'upstream_connect_time="$upstream_connect_time" '
                          'upstream_header_time="$upstream_header_time" '
                          'upstream_response_time="$upstream_response_time" '
                          'ref="$http_referer" ua="$http_user_agent" req_id="$request_id"';

server {
    # Change to port 8090 to match the exposed port in the Dockerfile
    listen 8090;
    server_name localhost;
    
    # Verbose request and upstream diagnostics for Azure Container Apps logs
    access_log /dev/stdout bagtag_verbose;
    error_log /dev/stderr info;

    # API routes - Leite alles an Next.js weiter, da die Logik nun in app/api/... liegt
    location = /api {
        proxy_pass http://127.0.0.1:3000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # UI routes
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
#        proxy_cache_bypass $http_upgrade;
    }
}

